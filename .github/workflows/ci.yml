name: MinaMatch V2 CI

on:
  push:
    branches: [version-2, main]
  pull_request:
    branches: [version-2, main]

env:
  NODE_VERSION: '22'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (V2 strict + V1 informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Lint V2 — backend
        run: npx tsc --noEmit --project packages/backend/tsconfig.json
      - name: Lint V2 — database
        run: npx tsc --noEmit --project packages/database/tsconfig.json
      - name: Lint V1 — root (informational)
        run: 'npx tsc --noEmit || echo "V1 lint: 3 pre-existing errors in LandingPage.tsx (safe)"'
        continue-on-error: true

  build:
    name: Build (Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build frontend
        run: pnpm run build

  test-sqlite:
    name: Tests — SQLite (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Run SQLite tests
        run: pnpm --filter @minamatch/backend test:sqlite
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-sqlite
          path: packages/backend/**/__snapshots__/
          retention-days: 7

  test-postgres:
    name: Tests — PostgreSQL (CI container)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: minamatch
          POSTGRES_PASSWORD: minamatch_dev
          POSTGRES_DB: minamatch_v2
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://minamatch:minamatch_dev@localhost:5432/minamatch_v2
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Wait for PostgreSQL
        run: |
          for i in {1..10}; do
            pg_isready -h localhost -U minamatch && break
            sleep 2
          done
        env:
          PGPASSWORD: minamatch_dev
      - name: Run migrations
        run: pnpm db:migrate
      - name: Seed database
        run: pnpm db:seed
      - name: Run PostgreSQL tests
        run: pnpm --filter @minamatch/backend test:postgres
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-output-postgres
          path: packages/backend/**/__snapshots__/
          retention-days: 7
